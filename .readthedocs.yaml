# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: sphinx/conf.py
  fail_on_warning: true

# Build documentation with MkDocs
#mkdocs:
#  configuration: mkdocs.yml

# Optionally build your docs in additional formats such as PDF and ePub
formats: all

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - openjdk-21-jdk
    - maven
  jobs:
    pre_build:
      - java -version
      - mvn -version
      - mvn -X clean compile -f pom.xml
      - cp ./target/sphinx/formats/*.rst ./sphinx/formats
      - cp ./target/sphinx/*.rst ./sphinx/
      - cp -R ./target/sphinx/metadata ./sphinx/
      - rm -rf ./target/sphinx/developers/examples/META-INF
      - cp -R ./target/sphinx/developers/examples ./sphinx/developers

# Optionally set the version of Python and requirements required to build your docs
python:
  install:
    - requirements: requirements.txt
